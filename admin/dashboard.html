<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — UR Fire Safety Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="dashboard-page">
  <header class="admin-header">
    <div class="admin-header-inner">
      <div class="admin-brand">
        <img src="../assets/UR_Fire_Logo.svg" alt="UR Fire Safety" class="admin-logo">
        <span>Admin Panel</span>
      </div>
      <div class="admin-header-right">
        <span class="admin-user" id="adminUserDisplay"></span>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <div class="admin-container">
      <div class="admin-toolbar">
        <h2>Leads</h2>
        <div class="filter-group">
          <label for="statusFilter">Filter:</label>
          <select id="statusFilter">
            <option value="">All</option>
            <option value="new">New</option>
            <option value="contacted">Contacted</option>
            <option value="closed">Closed</option>
          </select>
        </div>
      </div>

      <div class="table-wrapper">
        <table class="leads-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Phone</th>
              <th>Service</th>
              <th>Status</th>
              <th>Date</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="leadsBody">
            <tr><td colspan="7" class="loading-cell">Loading...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>
  </main>

  <div class="modal-overlay" id="leadModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Lead Details</h3>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
